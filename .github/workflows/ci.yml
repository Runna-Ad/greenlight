name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 — los scripts de test importan .ts directamente (import("../src/lib/x.ts")),
          # que sólo funciona con el type-stripping nativo de Node ≥22.18/24 (local usa v24).
          # Con Node 20 el `npm test` revienta con ERR_UNKNOWN_FILE_EXTENSION para ".ts".
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
